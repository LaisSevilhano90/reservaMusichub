<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HUB</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../home/home.css">

<body>
    <header class="top">
        <div class="logo">HUB</div>
        <label class="search glass">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
            </svg>
            <input type="search" placeholder="Search artists, tracks, playlists...">
        </label>
        <div class="avatar glass"></div>
    </header>

    <nav class="side glass" aria-label="Principal">
        <button class="on" aria-label="Início"><svg viewBox="0 0 24 24">
                <path d="M12 3 3 11h2v9h5v-6h4v6h5v-9h2z" />
            </svg></button>
        <button aria-label="Biblioteca"><svg viewBox="0 0 24 24">
                <path d="M4 4h3v16H4zM9 4h3v16H9zM14.5 5.2l2.9-.8 3.6 15.4-2.9.8z" />
            </svg></button>
        <button aria-label="Favoritos"><svg viewBox="0 0 24 24">
                <path d="M12 21s-8-5.4-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.6-8 11-8 11z" />
            </svg></button>
    </nav>

    <main>
        <section class="hero" aria-label="Destaques">
            <div class="c"><img src="../imgs/home/travis.png" alt=""></div>
            <div class="c"><img src="../imgs/home/eminem.png" alt=""></div>
            <div class="c"><img src="../imgs/home/olivia.png" alt=""></div>
            <div class="c"><img src="../imgs/home/billie.png" alt=""></div>
            <div class="c"><img src="../imgs/home/blackpink.png" alt=""></div>
        </section>

        <!-- Artistas -->
        <section class="artists" aria-label="Artistas">
            <i><img src="../imgs/home/cartola.jpg" alt="Artista 5"></i>
            <i><img src="../imgs/home/cartola.jpg" alt="Artista 5"></i>
            <i><img src="../imgs/home/cartola.jpg" alt="Artista 5"></i>
            <i><img src="../imgs/home/weekend.jpg" alt="Artista 5"></i>
            <i><img src="../imgs/home/cartola.jpg" alt="Artista 5"></i>
        </section>

        <section class="sec">
            <div class="sec-h">
                <h2>Your Playlists</h2><a href="#">Mostrar tudo</a>
            </div>
            <div class="row">
                <div class="cover" style="background:linear-gradient(135deg,#c9707a,#5a1a2a)"></div>
                <div class="cover" style="background:linear-gradient(135deg,#e6b8c8,#222)"></div>
                <div class="cover" style="background:linear-gradient(135deg,#8a1a1a,#111)"></div>
                <div class="cover" style="background:linear-gradient(135deg,#ddd,#222)"></div>
                <div class="cover" style="background:linear-gradient(135deg,#e8e0d0,#4a3a3a)"></div>
            </div>
        </section>

        <section class="sec">
            <div class="sec-h">
                <h2>Recents</h2><a href="#">Mostrar tudo</a>
            </div>
            <div class="row recents">
                <div class="cover" style="background:linear-gradient(135deg,#ff3a6e,#3a5ad8)"></div>
                <div class="cover" style="background:linear-gradient(135deg,#444,#050505)"></div>
                <div class="cover" style="background:linear-gradient(135deg,#d9b48a,#8a5a3a)"></div>
                <div class="cover" style="background:linear-gradient(135deg,#8a4ab0,#e6a04a)"></div>
                <div class="cover" style="background:#fff"></div>
            </div>
        </section>

        <section class="sec">
            <div class="sec-h">
                <h2>Ao redor do Mundo</h2>
            </div>
            <div class="world">
                <div class="col">
                    <div class="flag" style="background:linear-gradient(#ce1126 33%,#fff 33% 66%,#000 66%)"></div>
                    <div class="pill" style="--c:#e0303a"><b>Garee2a Awy</b>
                        <div class="cover" style="background:linear-gradient(135deg,#e6a03a,#b02a2a)"></div>
                        <div class="wave"></div><button class="play" aria-label="Tocar"><svg viewBox="0 0 10 10">
                                <path d="M1 0v10l9-5z" />
                            </svg></button>
                    </div>
                </div>
                <div class="col">
                    <div class="flag" style="background:linear-gradient(#fff 33%,#0039a6 33% 66%,#d52b1e 66%)"></div>
                    <div class="pill" style="--c:#4a4aff"><b>Шаца</b>
                        <div class="cover" style="background:linear-gradient(135deg,#8aa0a0,#223)"></div>
                        <div class="wave"></div><button class="play" aria-label="Tocar"><svg viewBox="0 0 10 10">
                                <path d="M1 0v10l9-5z" />
                            </svg></button>
                    </div>
                </div>
                <div class="col">
                    <div class="flag"
                        style="background:linear-gradient(135deg,#009c3b 30%,#ffdf00 30% 70%,#009c3b 70%)"></div>
                    <div class="pill" style="--c:#2fa84a"><b>Cuida do Pet</b>
                        <div class="cover" style="background:linear-gradient(135deg,#d64a3a,#3a2a1a)"></div>
                        <div class="wave"></div><button class="play" aria-label="Tocar"><svg viewBox="0 0 10 10">
                                <path d="M1 0v10l9-5z" />
                            </svg></button>
                    </div>
                </div>
                <div class="col">
                    <div class="flag" style="background:repeating-linear-gradient(#b22234 0 3px,#fff 3px 6px)"></div>
                    <div class="pill" style="--c:#e0303a"><b>Choosin' Texas</b>
                        <div class="cover" style="background:linear-gradient(135deg,#7ab0d8,#8a2a2a)"></div>
                        <div class="wave"></div><button class="play" aria-label="Tocar"><svg viewBox="0 0 10 10">
                                <path d="M1 0v10l9-5z" />
                            </svg></button>
                    </div>
                </div>
                <div class="col">
                    <div class="flag" style="background:#fff;border:1px solid #ccc"></div>
                    <div class="pill" style="--c:#8a4ac8"><b>REDRED</b>
                        <div class="cover" style="background:linear-gradient(135deg,#8ab0a0,#3a3a4a)"></div>
                        <div class="wave"></div><button class="play" aria-label="Tocar"><svg viewBox="0 0 10 10">
                                <path d="M1 0v10l9-5z" />
                            </svg></button>
                    </div>
                </div>
                <div class="col">
                    <div class="flag" style="background:linear-gradient(#000 33%,#d00 33% 66%,#ffce00 66%)"></div>
                    <div class="pill" style="--c:#e6b820"><b>Dai Dai</b>
                        <div class="cover" style="background:linear-gradient(135deg,#f0c0a0,#a04a3a)"></div>
                        <div class="wave"></div><button class="play" aria-label="Tocar"><svg viewBox="0 0 10 10">
                                <path d="M1 0v10l9-5z" />
                            </svg></button>
                    </div>
                </div>
                <div class="col">
                    <div class="flag" style="background:linear-gradient(90deg,#006847 33%,#fff 33% 66%,#ce1126 66%)">
                    </div>
                    <div class="pill" style="--c:#2fa84a"><b>Nalguita y Teta</b>
                        <div class="cover" style="background:linear-gradient(135deg,#e6a04a,#5a2a1a)"></div>
                        <div class="wave"></div><button class="play" aria-label="Tocar"><svg viewBox="0 0 10 10">
                                <path d="M1 0v10l9-5z" />
                            </svg></button>
                    </div>
                </div>
                <div class="col">
                    <div class="flag" style="background:linear-gradient(90deg,#009246 33%,#fff 33% 66%,#ce2b37 66%)">
                    </div>
                    <div class="pill" style="--c:#2fb0d8"><b>MA REVOLUTION</b>
                        <div class="cover" style="background:linear-gradient(135deg,#d8402a,#2a1a3a)"></div>
                        <div class="wave"></div><button class="play" aria-label="Tocar"><svg viewBox="0 0 10 10">
                                <path d="M1 0v10l9-5z" />
                            </svg></button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Player flutuante -->
    <footer class="player glass" aria-label="Player">
        <div class="now">
            <div class="cover" style="background:linear-gradient(135deg,#b04a7a,#3a1a3a)"></div>
            <div><b>Fever</b><span>Dua Lipa</span></div>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="#fff">
                <path d="M12 21s-8-5.4-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.6-8 11-8 11z" />
            </svg>
        </div>
        <div class="ctrl">
            <div class="btns">
                <button aria-label="Aleatório"><svg viewBox="0 0 24 24">
                        <path
                            d="M17 3l4 4-4 4V8h-3l-3 4-1.6-2L12 6h5zM3 6h4l9 12h5v-3l4 4-4 4v-3h-6L6 8H3zM3 16h3l2-2.6 1.6 2L7 18H3z" />
                    </svg></button>
                <button aria-label="Anterior"><svg viewBox="0 0 24 24">
                        <path d="M6 5h2v14H6zM20 5v14L9 12z" />
                    </svg></button>
                <button class="pp" aria-label="Pausar"><svg viewBox="0 0 24 24">
                        <path d="M7 4h4v16H7zM13 4h4v16h-4z" />
                    </svg></button>
                <button aria-label="Próxima"><svg viewBox="0 0 24 24">
                        <path d="M16 5h2v14h-2zM4 5l11 7L4 19z" />
                    </svg></button>
                <button aria-label="Repetir"><svg viewBox="0 0 24 24">
                        <path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z" />
                    </svg></button>
            </div>
            <div class="bar"><span>1:24</span><i></i><span>2:45</span></div>
        </div>
        <div class="vol">
            <svg viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z" />
            </svg><i></i>
        </div>
    </footer>

</body>

</html>
